<p-toast></p-toast>

<section class="login-page">
  <div class="login-page__backdrop" aria-hidden="true">
    <span class="login-page__grid"></span>
  </div>

  <main class="login-shell">
    <div class="login-card">
      <header class="login-card__header">
        <img
          class="login-card__logo"
          src="/assets/images/logo-sg.png"
          alt="SG Motos"
          width="120"
          height="120"
        />
        <h1 class="login-card__title">Iniciar sesión</h1>
        <p class="login-card__subtitle">Panel de administración SG Motos</p>
      </header>

      <form
        class="login-form"
        [formGroup]="loginForm"
        (ngSubmit)="login()"
        autocomplete="on"
      >
        <div class="login-field">
          <label class="login-field__label" for="inputUsername">Usuario</label>
          <div class="login-field__control">
            <ion-icon name="person-outline" aria-hidden="true"></ion-icon>
            <input
              id="inputUsername"
              type="text"
              class="login-field__input"
              placeholder="Tu usuario"
              formControlName="username"
              autocomplete="username"
            />
          </div>
        </div>

        <div class="login-field">
          <label class="login-field__label" for="inputPassword">Contraseña</label>
          <div class="login-field__control">
            <ion-icon name="lock-closed-outline" aria-hidden="true"></ion-icon>
            <input
              id="inputPassword"
              type="password"
              class="login-field__input"
              placeholder="Tu contraseña"
              formControlName="password"
              autocomplete="current-password"
            />
          </div>
        </div>

        <button type="submit" class="login-submit">
          <span>Iniciar sesión</span>
          <ion-icon name="arrow-forward-outline" aria-hidden="true"></ion-icon>
        </button>
      </form>
    </div>

    <p class="login-footer">SG Motos · Gestión integral</p>
  </main>
</section>
